<!doctype html>
<meta charset="utf-8">
<title>cosmos</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="out"></canvas>
<script type="module">
import { CelestialGenerator, CelestialType, renderNebula } from "/vendor/cosmos/dist/index.js";

const { width: W, height: H, seed, params } = window.WP ?? { width: innerWidth, height: innerHeight, seed: 1, params: {} };

function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

try {
  const rnd = mulberry32(seed);
  const out = document.getElementById("out");
  out.width = W; out.height = H;
  const ctx = out.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  const nebula = renderNebula(seed, 1024);
  const cover = Math.max(W, H) * 1.15;
  ctx.globalAlpha = 0.8;
  ctx.drawImage(nebula, (W - cover) / 2, (H - cover) / 2, cover, cover);
  ctx.globalAlpha = 1;

  const starScale = W / 3000 + 0.5;
  const nStars = Math.round((W * H) / 3500);
  for (let i = 0; i < nStars; i++) {
    const x = rnd() * W, y = rnd() * H, r = rnd();
    const size = (r < 0.9 ? 1 : r < 0.98 ? 1.5 : 2.2) * starScale;
    ctx.fillStyle = `rgba(255,255,255,${0.25 + rnd() * 0.75})`;
    ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
  }

  const bodyTypes = [
    CelestialType.TerrainWet, CelestialType.TerrainDry, CelestialType.Aquatic, CelestialType.Barren,
    CelestialType.GasGiant, CelestialType.GasGiantRinged, CelestialType.Molten, CelestialType.Ice,
    CelestialType.Star, CelestialType.Galaxy, CelestialType.BlackHole,
  ];
  const allTypes = Object.values(CelestialType);
  const type = allTypes.includes(params.type) ? params.type : bodyTypes[Math.floor(rnd() * bodyTypes.length)];
  const isDiffuse = type === CelestialType.Galaxy || type === CelestialType.BlackHole;

  const gen = new CelestialGenerator();
  await gen.precompile([type]);
  const res = Math.min(4096, Math.round(H * (isDiffuse ? 0.95 : 0.6)));
  const t = rnd() * 100;
  const body = gen.render({ type, seed, resolution: res }, t);

  const side = rnd() < 0.5 ? -1 : 1;
  const cx = W / 2 + side * W * (0.12 + rnd() * 0.13);
  const cy = H / 2 + (rnd() - 0.5) * H * 0.15;
  ctx.drawImage(body, cx - res / 2, cy - res / 2, res, res);

  const canHaveMoon = !isDiffuse && type !== CelestialType.Star;
  if (canHaveMoon && rnd() < 0.55) {
    const moonType = rnd() < 0.5 ? CelestialType.Barren : CelestialType.Ice;
    const mres = Math.round(res * (0.14 + rnd() * 0.12));
    const moon = gen.render({ type: moonType, seed: seed + 1, resolution: mres }, t);
    const ang = rnd() * Math.PI * 2;
    const dist = res * (0.62 + rnd() * 0.25);
    ctx.drawImage(moon, cx + Math.cos(ang) * dist - mres / 2, cy + Math.sin(ang) * dist - mres / 2, mres, mres);
  }
  console.log(`cosmos: ${type} seed=${seed} res=${res}`);
} catch (e) {
  console.error("cosmos failed:", e?.stack ?? e);
} finally {
  window.WP_DONE = true;
}
</script>
