<!doctype html>
<meta charset="utf-8">
<title>monolith</title>
<link rel="stylesheet" href="/vendor/monolith-terrain/src/style.css">
<style>html,body{margin:0;overflow:hidden;background:#fff}#app canvas{display:block}</style>
<div id="app"></div>
<script type="importmap">
{ "imports": {
  "three": "/vendor/monolith-terrain/node_modules/three/build/three.module.js",
  "three/addons/": "/vendor/monolith-terrain/node_modules/three/examples/jsm/",
  "postprocessing": "/vendor/monolith-terrain/node_modules/postprocessing/build/index.js"
} }
</script>
<script type="module">
// a headless recomposition of monolith-terrain's main.js: same scene, same post chain,
// procedural source only, seeded camera/sun/terrain, no GUI, no controls, no animation loop.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import {
  EffectComposer, RenderPass, EffectPass, VignetteEffect, NoiseEffect, SMAAEffect,
  HueSaturationEffect, BrightnessContrastEffect, ToneMappingEffect, ToneMappingMode, Effect, BlendFunction,
} from "postprocessing";
import { Terrain, FLOOR_Y } from "/vendor/monolith-terrain/src/terrain.js";
import { Simplex2, mulberry32 as seededRng, fbm, ridged, smoothstep } from "/vendor/monolith-terrain/src/noise.js";
import { createCone } from "/vendor/monolith-terrain/src/cone.js";
import { createLabels } from "/vendor/monolith-terrain/src/labels.js";
import { createHud3D, findPois } from "/vendor/monolith-terrain/src/hud3d.js";
import { createHud2D } from "/vendor/monolith-terrain/src/hud2d.js";

const { width: W, height: H, seed, params: P } = window.WP ?? { width: innerWidth, height: innerHeight, seed: 7, params: {} };

function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(seed);
const between = (a, b) => a + rnd() * (b - a);
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];

// their procedural sampler, minus the flat excavation basin carved at the origin
class OpenTerrain extends Terrain {
  _makeSampler(params) {
    this._h2ft = null;
    const rng = seededRng(params.seed);
    const sWarp = new Simplex2(rng), sRidge = new Simplex2(rng), sBase = new Simplex2(rng), sDetail = new Simplex2(rng);
    const craterRng = seededRng(params.seed ^ 0x9e3779b9);
    const craters = [];
    for (let i = 0; i < 7; i++) {
      const a = craterRng() * Math.PI * 2, d = 10.5 + craterRng() * 10;
      craters.push({ x: Math.cos(a) * d, z: Math.sin(a) * d, r: 1.6 + craterRng() * 2.8, depth: (0.45 + craterRng() * 0.9) * params.amplitude * 0.35 });
    }
    const { scale, octaves, lacunarity, gain, amplitude, warp, detail, detailScale } = params;
    return (x, z) => {
      const wx = x + warp * fbm(sWarp, x * 0.045 + 7.3, z * 0.045 + 2.1, 3, 2.1, 0.5);
      const wz = z + warp * fbm(sWarp, x * 0.045 - 4.7, z * 0.045 + 9.4, 3, 2.1, 0.5);
      const m = ridged(sRidge, wx * scale, wz * scale, octaves, lacunarity, gain);
      const base = fbm(sBase, wx * scale * 2.1, wz * scale * 2.1, octaves, lacunarity, gain);
      let h = amplitude * (m * m * 1.2 + base * 0.28);
      for (const c of craters) {
        const d = Math.hypot(x - c.x, z - c.z);
        if (d < c.r * 1.6) {
          const bowl = 1 - smoothstep(0, c.r, d);
          h -= c.depth * bowl * bowl * bowl * 2.2;
          h += c.depth * 0.4 * Math.exp(-Math.pow((d - c.r) / (c.r * 0.28), 2));
        }
      }
      const fine = detail * fbm(sDetail, x * detailScale, z * detailScale, 3, 2.3, 0.55)
        + detail * 0.35 * fbm(sDetail, x * detailScale * 4.1 + 31, z * detailScale * 4.1 - 17, 2, 2.2, 0.5);
      return h + fine;
    };
  }
}

try {
  const mode = ["monolith", "landscape"].includes(P.mode) ? P.mode : pick(["monolith", "monolith", "landscape"]);
  const params = {
    source: "noise",
    seed: 1 + (seed % 9999),
    scale: between(0.045, 0.085), octaves: 6, lacunarity: 2.2, gain: 0.55,
    amplitude: between(1.2, 2.8), warp: between(1, 4), detail: 0, detailScale: 1.9,
    resolution: Number(P.resolution ?? (W > 4000 ? 1024 : 768)),
    color: "#c2c2c2", roughness: 1, roughnessVariation: 0.5, roughnessScale: 1, bumpScale: 0.2, envMapIntensity: 1.5,
    fov: 43,
    mapTint: 1, heightContrast: 5.1, heightPivot: 0.53,
    gradLow: "#ffffff", gradMid1: "#ffffff", gradMid2: "#ffffff", gradHigh: pick(["#ffa861", "#ffa861", "#e8b04a", "#d98a5a", "#8fb8de"]),
    gradMid1Pos: 0.35, gradMid2Pos: 0.36, slopeTint: 0.5,
    contourInterval: 0.11, contourOpacity: 1, contourColor: "#000000", gridStep: 5, gridOpacity: 1,
    hud: P.hud !== "off", hudAccent: pick(["#ff4d00", "#ff4d00", "#ff4d00", "#0066ff", "#00a86b"]), hudInk: "#17191b", uiBlur: 9, uiBgOpacity: 0.4,
    scanColor: "#ccd6ff", scanWidth: 0.8, scanBlur: 0.86, scanDispHeight: 1.16, scanDispFalloff: 1.2,
    exposure: 0.96, contrast: 0.07, saturation: -0.35, vignette: 0.6, grain: 0.35,
    fogNear: 35.5, fogFar: 50, fogColor: "#ffffff", surveyLines: true,
    coneSpin: 0, coneTilt: 0, coneDrift: 0, bob: 0,
    sunIntensity: 8.3, sunAzimuth: between(0, 360), sunElevation: between(14, 34), hemiIntensity: 0, envLight: 0.3, shadowSoftness: 15,
  };

  const renderer = new THREE.WebGLRenderer({ powerPreference: "high-performance", antialias: false, stencil: false, depth: false });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;
  renderer.toneMapping = THREE.NoToneMapping;
  document.getElementById("app").appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(params.fogColor);
  scene.fog = new THREE.Fog(new THREE.Color(params.fogColor), params.fogNear, params.fogFar);

  // their HOME pose is (0,18,19) -> (0,-0.3,0); orbit it by seed. landscape mode frames a spot
  // away from the origin, lower and closer, and keeps the camera over the 56x56 mesh
  const camera = new THREE.PerspectiveCamera(params.fov, W / H, 0.5, 220);
  const landscape = mode === "landscape";
  const tAz = between(0, Math.PI * 2), tDist = landscape ? between(5, 10) : between(0, 3);
  const target = new THREE.Vector3(Math.sin(tAz) * tDist, -0.3, Math.cos(tAz) * tDist);
  const az = between(0, Math.PI * 2);
  const dist = landscape ? between(14, 18) : between(20, 30);
  const height = landscape ? between(8, 14) : between(11, 21);
  camera.position.set(target.x + Math.sin(az) * dist, height, target.z + Math.cos(az) * dist);
  camera.lookAt(target);
  camera.updateMatrixWorld();

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = params.envLight;
  pmrem.dispose();

  const sun = new THREE.DirectionalLight(0xffffff, params.sunIntensity);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 4, far: 80 });
  sun.shadow.bias = -0.0001;
  sun.shadow.normalBias = 0.02;
  sun.shadow.radius = params.shadowSoftness;
  sun.shadow.blurSamples = 16;
  const sAz = THREE.MathUtils.degToRad(params.sunAzimuth), sEl = THREE.MathUtils.degToRad(params.sunElevation);
  sun.position.set(Math.cos(sAz) * Math.cos(sEl) * 34, Math.sin(sEl) * 34, Math.sin(sAz) * Math.cos(sEl) * 34);
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0xdadada, 0x5c5c5c, params.hemiIntensity));

  const terrain = landscape ? new OpenTerrain(params) : new Terrain(params);
  scene.add(terrain.mesh);

  // their hovering monolith is always the cone; vary it, same interface so the HUD keeps tracking
  function createMonolith(kind) {
    if (kind === "cone") return createCone();
    if (kind === "none") return null;
    const white = new THREE.MeshStandardMaterial({ color: 0xefefef, roughness: 0.3, metalness: 0.05, envMapIntensity: 0.9 });
    const black = new THREE.MeshStandardMaterial({ color: 0x101010, roughness: 0.35, metalness: 0.1, envMapIntensity: 0.6 });
    let mesh, h;
    switch (kind) {
      case "slab": mesh = new THREE.Mesh(new THREE.BoxGeometry(0.95, 2.7, 0.34), black); h = 2.7; break;
      case "octahedron": mesh = new THREE.Mesh(new THREE.OctahedronGeometry(1.25, 0), white); h = 2.5; break;
      case "sphere": mesh = new THREE.Mesh(new THREE.SphereGeometry(1.0, 64, 48), rnd() < 0.5 ? white : black); h = 2.0; break;
      case "ring":
        mesh = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.17, 32, 128), white);
        mesh.rotation.x = Math.PI / 2 + between(-0.5, 0.5);
        h = 2.6;
        break;
    }
    mesh.castShadow = true;
    const group = new THREE.Group();
    group.add(mesh);
    const baseY = FLOOR_Y + 0.62 + h / 2;
    group.position.set(0, baseY, 0);
    group.rotation.y = between(0, Math.PI * 2);
    const focus = new THREE.Vector3();
    return { group, getFocusPoint: () => focus.set(0, baseY + h * 0.3, 0), update() {} };
  }
  const shape = landscape ? "none"
    : ["cone", "slab", "octahedron", "sphere", "ring", "none"].includes(P.shape)
      ? P.shape : pick(["cone", "cone", "slab", "slab", "octahedron", "sphere", "ring"]);
  const mono = createMonolith(shape);
  if (mono) scene.add(mono.group);
  const focusPoint = () => (mono ? mono.getFocusPoint() : new THREE.Vector3(0, 0.6, 0));
  const toFeet = (h) => terrain.heightToFeet(h);
  scene.add(createLabels(terrain.sample, params.seed, { real: false, toFeet }));
  const pois = findPois(terrain.sample, params.seed, toFeet);
  const hud3 = createHud3D(params.seed, pois, { ink: params.hudInk, accent: params.hudAccent });
  // the survey circles and dial platform are centered on the excavation; drop them with it
  hud3.lines.visible = params.surveyLines && !landscape;
  hud3.platform.visible = !landscape;
  scene.add(hud3.group);

  // the HUD is DOM in CSS px; zoom it so panels keep the same share of the frame at any resolution
  const uiScale = Math.max(1, W / 1800);
  let hud2 = null;
  if (params.hud) {
    hud2 = createHud2D({});
    hud2.root.style.zoom = uiScale;
    hud2.setPois(pois);
    hud2.setStatic(params);
    hud2.setReticleVisible(mono !== null);
    const css = document.documentElement.style;
    css.setProperty("--hud-accent", params.hudAccent);
    css.setProperty("--hud-ink", params.hudInk);
    css.setProperty("--hud-blur", `${params.uiBlur}px`);
    css.setProperty("--hud-bg-alpha", params.uiBgOpacity);
  }

  class ExposureEffect extends Effect {
    constructor(exposure) {
      super("ExposureEffect",
        "uniform float exposure; void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) { outputColor = vec4(inputColor.rgb * exposure, inputColor.a); }",
        { uniforms: new Map([["exposure", new THREE.Uniform(exposure)]]) });
    }
  }
  const grain = new NoiseEffect({ blendFunction: BlendFunction.OVERLAY, premultiply: false });
  grain.blendMode.opacity.value = params.grain;
  const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new EffectPass(camera,
    new ExposureEffect(params.exposure),
    new ToneMappingEffect({ mode: ToneMappingMode.ACES_FILMIC }),
    new HueSaturationEffect({ saturation: params.saturation }),
    new BrightnessContrastEffect({ brightness: 0, contrast: params.contrast }),
    grain,
    new VignetteEffect({ darkness: params.vignette, offset: 0.28 }),
    new SMAAEffect(),
  ));

  const t0 = between(0, 60);
  const mouse = new THREE.Vector2(0, 0);
  const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(target));
  const secs = Math.floor(t0);
  for (let i = 0; i < 3; i++) {
    const t = t0 + i / 60;
    hud3.update(1 / 60, t, params);
    mono?.update(1 / 60, t, mouse, params);
    hud2?.update(1, camera, W / uiScale, H / uiScale, {
      conePoint: focusPoint(), pois,
      az: THREE.MathUtils.radToDeg(sph.theta), el: 90 - THREE.MathUtils.radToDeg(sph.phi),
      focus: camera.position.distanceTo(focusPoint()), fps: 60,
      clock: `${String(Math.floor(secs / 60)).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")}`,
      coneAlt: mono?.group.position.y ?? 0, spin: params.coneSpin,
    });
    composer.render(1 / 60);
  }
  console.log(`monolith: seed=${params.seed} res=${params.resolution} mode=${mode} shape=${shape} accent=${params.hudAccent}`);
} catch (e) {
  console.error("monolith failed:", e?.stack ?? e);
} finally {
  window.WP_DONE = true;
}
</script>
