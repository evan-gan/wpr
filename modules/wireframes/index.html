<!doctype html>
<meta charset="utf-8">
<title>wireframes</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": { "three": "/vendor/monolith-terrain/node_modules/three/build/three.module.js" } }
</script>
<script type="module">
// mattdesl's stylized wireframe shader, driven by his own curated presets (gui.json) with
// mild seeded variation: which preset, camera orbit, a gentle tilt, segment counts, noise phase.
import * as THREE from "three";

const { width: W, height: H, seed, params } = window.WP ?? { width: innerWidth, height: innerHeight, seed: 1, params: {} };

function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(seed);
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const between = (a, b) => a + rnd() * (b - a);
const int = (a, b) => a + Math.floor(rnd() * (b - a + 1));

try {
  const [fragSrc, vertSrc, noiseSrc, gui] = await Promise.all([
    fetch("/vendor/webgl-wireframes/lib/wire.frag").then((r) => r.text()),
    fetch("/vendor/webgl-wireframes/lib/wire.vert").then((r) => r.text()),
    fetch("/hosts/web/node_modules/glsl-noise/simplex/4d.glsl").then((r) => r.text()),
    fetch("/vendor/webgl-wireframes/lib/gui.json").then((r) => r.json()),
  ]);

  // glslify by hand: the shader's two requires become inlined source
  const frag = fragSrc
    .replace(/#pragma glslify: noise = require\('glsl-noise\/simplex\/4d'\);?/,
      noiseSrc.replace(/#pragma glslify:.*$/gm, "") + "\nfloat noise(vec4 v) { return snoise(v); }")
    .replace(/#pragma glslify: PI = require\('glsl-pi'\);?/, "#define PI 3.141592653589793");

  const presets = gui.remembered;
  const presetName = presets[params.preset] ? params.preset : pick(Object.keys(presets));
  const p = presets[presetName]["0"];

  const canvas = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  // 2x backing store composited down by the page = supersampling, for when MSAA isn't there
  const gl = renderer.getContext();
  const msaa = gl.getParameter(gl.SAMPLES);
  const ratio = msaa >= 4 ? 1 : Math.min(2, 12000 / W);
  renderer.setPixelRatio(ratio);
  renderer.setSize(W, H);
  renderer.setClearColor(p.backgroundHex, 1);
  gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, W / H, 0.01, 100);

  const material = new THREE.ShaderMaterial({
    transparent: true,
    side: THREE.DoubleSide,
    uniforms: {
      time: { value: between(0, 100) },
      fill: { value: new THREE.Color(p.fillHex) },
      stroke: { value: new THREE.Color(p.strokeHex) },
      noiseA: { value: p.noiseA },
      noiseB: { value: p.noiseB },
      dualStroke: { value: p.dualStroke },
      seeThrough: { value: p.seeThrough },
      insideAltColor: { value: p.insideAltColor },
      thickness: { value: p.thickness },
      secondThickness: { value: p.secondThickness },
      dashEnabled: { value: p.dashEnabled },
      dashRepeats: { value: p.dashRepeats },
      dashOverlap: { value: p.dashOverlap },
      dashLength: { value: p.dashLength },
      dashAnimate: { value: false },
      squeeze: { value: p.squeeze },
      squeezeMin: { value: p.squeezeMin },
      squeezeMax: { value: p.squeezeMax },
    },
    vertexShader: vertSrc,
    fragmentShader: frag,
  });

  // his geometries with their default segment counts, nudged a little by seed
  function geometry(kind) {
    switch (kind) {
      case "TorusKnot": {
        const g = new THREE.TorusKnotGeometry(0.7, 0.3, int(26, 36), 4, pick([2, 2, 3]), 3);
        g.rotateY(-Math.PI * 0.5);
        return g;
      }
      case "Icosphere": return new THREE.IcosahedronGeometry(1, 1);
      case "Sphere": return new THREE.SphereGeometry(1, int(18, 24), int(9, 12));
      case "Torus": return new THREE.TorusGeometry(1, 0.3, 8, int(26, 34));
      case "Tube": {
        // a smooth closed curve through the 12 icosahedron vertices, like his NURBS tube
        const pos = new THREE.IcosahedronGeometry(1, 0).attributes.position;
        const seen = new Set(), ring = [];
        for (let i = 0; i < pos.count; i++) {
          const v = new THREE.Vector3().fromBufferAttribute(pos, i);
          const k = v.toArray().map((n) => n.toFixed(3)).join(",");
          if (!seen.has(k)) { seen.add(k); ring.push(v); }
        }
        const curve = new THREE.CatmullRomCurve3(ring, true, "centripetal");
        return new THREE.TubeGeometry(curve, int(28, 36), 0.3, 4, true);
      }
    }
  }

  // his geom.js on modern three: un-index, then a barycentric triple per triangle corner
  function addBarycentric(geo, removeEdge) {
    const g = geo.index ? geo.toNonIndexed() : geo;
    const tris = g.attributes.position.count / 3;
    const bary = new Float32Array(tris * 9);
    const Q = removeEdge ? 1 : 0;
    for (let i = 0; i < tris; i++) {
      bary.set(i % 2 === 0 ? [0, 0, 1, 0, 1, 0, 1, 0, Q] : [0, 1, 0, 0, 0, 1, 1, 0, Q], i * 9);
    }
    g.setAttribute("barycentric", new THREE.BufferAttribute(bary, 3));
    return g;
  }

  const kind = p.name;
  const mesh = new THREE.Mesh(addBarycentric(geometry(kind), p.edgeRemoval), material);
  // a gentle tilt, not a tumble: his demo orbits an upright object
  mesh.rotation.set(between(-0.35, 0.35), between(0, Math.PI * 2), between(-0.25, 0.25));
  scene.add(mesh);

  const bulky = kind === "Torus" || kind === "Tube";
  const angle = between(0, Math.PI * 2), elev = between(-0.25, 0.3), radius = between(4.8, 5.8) * (bulky ? 1.25 : 1);
  camera.position.set(Math.cos(angle) * Math.cos(elev) * radius, Math.sin(elev) * radius, Math.sin(angle) * Math.cos(elev) * radius);
  // aim past the object so it sits off-center; shift scales with aspect so it lands at the same
  // fraction of the frame on any display
  const forward = camera.position.clone().negate().normalize();
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
  const side = rnd() < 0.5 ? -1 : 1;
  const target = right.multiplyScalar(side * between(0.8, 1.4) * (W / H) / 2.4);
  target.y += between(-0.2, 0.2);
  camera.lookAt(target);

  renderer.render(scene, camera);
  console.log(`wireframes: preset=${presetName} geo=${kind} msaa=${msaa} ratio=${ratio.toFixed(2)}`);
} catch (e) {
  console.error("wireframes failed:", e?.stack ?? e);
} finally {
  window.WP_DONE = true;
}
</script>
